<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属导航主页</title>
    <style>
        /* --- 全局样式 --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; /* 浅灰色背景 */
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 顶部标题区 --- */
        header {
            margin-top: 40px;
            text-align: center;
        }
        header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* --- 搜索栏区域 (可选，如果不想要可以删掉) --- */
        .search-container {
            margin: 20px 0 30px 0;
            width: 80%;
            max-width: 500px;
        }
        .search-container form {
            display: flex;
        }
        .search-container input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            outline: none;
        }
        .search-container button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
        }
        .search-container button:hover {
            background-color: #2980b9;
        }

        /* --- 网址卡片网格布局 --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        /* --- 单个卡片样式 --- */
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none; /* 去掉链接下划线 */
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 轻微阴影 */
            transition: all 0.3s ease; /* 动画过渡 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 鼠标悬停在卡片上的效果 */
        .card:hover {
            transform: translateY(-5px); /* 向上浮动 */
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); /* 阴影加深 */
            color: #3498db; /* 文字变蓝 */
        }

        /* 网站图标 (这里使用 emoji 代替，你也可以换成真实的 img 图片) */
        .card-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* 网站名称 */
        .card-title {
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>我的专属导航</h1>
        <p>常用网站快捷入口</p>
    </header>

    <!-- 搜索栏：使用必应搜索 -->
    <div class="search-container">
        <form action="https://cn.bing.com/search" method="GET" target="_blank">
            <input type="text" name="q" placeholder="输入关键词，使用必应搜索..." required>
            <button type="submit">搜索</button>
        </form>
    </div>

    <!-- 网址卡片区域 -->
    <div class="grid-container">
        
        <!-- 卡片 1：B站 -->
        <a href="https://www.bilibili.com" target="_blank" class="card">
            <div class="card-icon">📺</div>
            <div class="card-title">哔哩哔哩</div>
        </a>

        <!-- 卡片 2：GitHub -->
        <a href="https://github.com" target="_blank" class="card">
            <div class="card-icon">💻</div>
            <div class="card-title">GitHub</div>
        </a>

        <!-- 卡片 3：知网 -->
        <a href="https://www.cnki.net" target="_blank" class="card">
            <div class="card-icon">📚</div>
            <div class="card-title">中国知网</div>
        </a>

        <!-- 卡片 4：知乎 -->
        <a href="https://www.zhihu.com" target="_blank" class="card">
            <div class="card-icon">💡</div>
            <div class="card-title">知乎</div>
        </a>

        <!-- 卡片 5：学校教务系统 (请把 href 里的网址换成你们学校的) -->
        <a href="#" target="_blank" class="card">
            <div class="card-icon">🏫</div>
            <div class="card-title">教务系统</div>
        </a>

        <!-- 卡片 6：ChatGPT / AI工具 -->
        <a href="https://chat.openai.com" target="_blank" class="card">
            <div class="card-icon">🤖</div>
            <div class="card-title">AI 助手</div>
        </a>

        <!-- 卡片 7：网易云音乐 -->
        <a href="https://music.163.com" target="_blank" class="card">
            <div class="card-icon">🎵</div>
            <div class="card-title">网易云音乐</div>
        </a>

        <!-- 卡片 8：百度网盘 -->
        <a href="https://pan.baidu.com" target="_blank" class="card">
            <div class="card-icon">☁️</div>
            <div class="card-title">百度网盘</div>
        </a>

    </div>

</body>
</html>
