<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习动态</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:#0f172a;color:#f8fafc;display:flex;padding:48px 40px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  
  /* 右侧渐隐人像 */
  .bg{position:fixed;right:0;bottom:0;width:55vw;height:100vh;background:url('https://ado159357.github.io/myweb/Alan-Turing.jpg') center/cover;-webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.1) 25%,rgba(0,0,0,.8) 60%,black 85%);mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.1) 25%,rgba(0,0,0,.8) 60%,black 85%);filter:brightness(.8) contrast(1.1);opacity:.65;pointer-events:none;z-index:1}
  
  /* 左侧内容区 */
  .app{position:relative;z-index:2;width:100%;max-width:560px;display:flex;flex-direction:column;gap:20px}
  h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sub{font-size:13px;color:#94a3b8;margin-top:-10px}
  
  /* 列表 */
  #list{list-style:none;display:flex;flex-direction:column;gap:12px;max-height:65vh;overflow-y:auto;padding-right:6px}
  #list::-webkit-scrollbar{width:4px}
  #list::-webkit-scrollbar-thumb{background:#334155;border-radius:99px}
  
  /* 卡片：改为绝对纯色，彻底防止浏览器颜色反转 */
  .task{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;display:flex;gap:14px;transition:.2s}
  .task:hover{background:#2d3b4f;border-color:#475569}
  
  /* 方案四：圆角方形对勾 */
  .badge{flex-shrink:0;width:22px;height:22px;border-radius:7px;background:#064e3b;border:1px solid #10b981;color:#34d399;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center}
  .bd{flex:1;min-width:0}
  .txt{font-size:15px;line-height:1.5;word-break:break-word;color:#f1f5f9}
  .tm{display:block;font-size:12px;color:#94a3b8;margin-top:6px;font-variant-numeric:tabular-nums}
  footer{font-size:13px;color:#94a3b8;padding-top:16px;border-top:1px solid #334155}
  
  /* 移动端 */
  @media(max-width:768px){body{padding:24px 16px}.bg{width:100vw;opacity:.15;filter:none}}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="app">
    <h1>💻 学习动态更新</h1>
    <p class="sub">这里记录着已经完成的项目</p>
    <ul id="list"></ul>
    <footer id="ft"></footer>
  </div>

<script>
  // 你的学习记录
  const data = [
    { t: 'C语言实现哈希表3--冲突处理:链地址法', d: '2026-10-10 23:00' },
    { t: '704.二分查找-力扣(LeetCode)--简单', d: '2026-10-10 15:00' },
    { t: 'C语言实现哈希表2--哈希函数的设计', d: '2026-10-10 12:00' },
    { t: 'C语言实现哈希表1--哈希表的基本概念与结构设计', d: '2026-10-09 23:00' },
    { t: '2841.几乎唯一子数组的最大和-力扣(LeetCode)--中等', d: '2026-10-07 20:00' }
  ];

  const pad = n => String(n).padStart(2, '0');
  const fmt = ts => {
    const n = new Date(), d = new Date(ts), t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.toDateString() === n.toDateString()) return `今天 ${t}`;
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return `昨天 ${t}`;
    return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${t}`;
  };

  const recs = data.map(r => ({ txt: r.t, ts: new Date(r.d.replace(/-/g, '/')).getTime() })).sort((a, b) => b.ts - a.ts);
  document.getElementById('list').innerHTML = recs.map(r => `
    <li class="task">
      <span class="badge">✓</span>
      <div class="bd">
        <p class="txt">${r.txt}</p>
        <span class="tm">${fmt(r.ts)}</span>
      </div>
    </li>`).join('');
  document.getElementById('ft').textContent = `共 ${recs.length} 条记录`;
</script>
</body>
</html>
