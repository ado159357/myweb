<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习动态</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--m:linear-gradient(to right,transparent 0%,#000 25%,#000 75%,transparent 100%)}
  body{font-family:-apple-system,sans-serif;background:#0f172a;display:flex;justify-content:center;color:#f8fafc;overflow-x:hidden}
  .container{position:relative;max-width:1200px;width:100%;min-height:100vh;display:flex;overflow:hidden;background:#0f172a}
  .bg{position:absolute;right:0;bottom:0;width:60%;height:100%;background:url('https://ado159357.github.io/myweb/Alan-Turing.jpg') center/cover;-webkit-mask-image:var(--m);mask-image:var(--m);filter:brightness(.8) contrast(1.1);opacity:.65;pointer-events:none;z-index:1}
  .app{position:relative;z-index:2;max-width:560px;width:100%;padding:48px 40px;display:flex;flex-direction:column;gap:20px}
  h1{font-size:22px;display:flex;align-items:center;gap:8px}
  .app>p{font-size:13px;color:#94a3b8;margin-top:-10px}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 220px);overflow-y:auto;padding-right:6px}
  ul::-webkit-scrollbar{width:4px}
  ul::-webkit-scrollbar-thumb{background:#334155;border-radius:99px}
  .task{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;transition:.2s}
  .task:hover{background:#2d3b4f;border-color:#475569}
  
  /* 👇 修复：去掉半透明，改用实色背景和边框，并强制阻止浏览器反色 */
  .badge{
    flex-shrink:0;
    width:22px;
    height:22px;
    border-radius:5px;
    background:#1e293b;  /* 与卡片同色，插件无法反转 */
    border:1px solid #475569; /* 实色边框，拒绝半透明 */
    color:#f8fafc;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:2px;
    forced-color-adjust:none; /* 强力阻止浏览器强制改变颜色 */
  }
  
  .badge svg{width:12px;height:12px;display:block;margin:auto;transform:translateY(4px)}
  .task>div{flex:1;min-width:0}
  .task p{color:#f1f5f9;font-size:15px;line-height:1.5;word-break:break-word}
  .task span{font-size:12px;color:#94a3b8;margin-top:6px;display:block}
  footer{font-size:13px;color:#94a3b8;padding-top:16px;border-top:1px solid #334155}
  @media(max-width:768px){
    .container{display:block}
    .bg{position:fixed;width:100%;height:100%;opacity:.15;filter:brightness(.6);-webkit-mask-image:none;mask-image:none}
    .app{padding:24px 16px;max-width:100%}
    ul{max-height:none;overflow-y:visible}
    .task{padding:14px 12px;gap:10px}
    .badge{width:20px;height:20px;border-radius:4px;margin-top:1px}
    .badge svg{width:10px;height:10px;transform:translateY(4px)}
    .task p{font-size:14px}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="bg"></div>
    <div class="app">
      <h1>💻 学习动态更新</h1>
      <p>这里记录着已经完成的项目</p>
      <ul id="list"></ul>
      <footer id="ft"></footer>
    </div>
  </div>
<script>
  const data=[
    {t:'Q3. 最大连续1的个数-力扣(LeetCode)--简单',d:'2026-10-11 21:36'},
    {t:'Q2. 重新排列数组-力扣(LeetCode)--简单',d:'2026-10-11 20:59'},
    {t:'Q1.数组串联-力扣(LeetCode)--简单',d:'2026-10-11 20:52'},
    {t:'C语言实现哈希表3--冲突处理:链地址法',d:'2026-10-10 23:00'},
    {t:'704.二分查找-力扣(LeetCode)--简单',d:'2026-10-10 15:00'},
    {t:'C语言实现哈希表2--哈希函数的设计',d:'2026-10-10 12:00'},
    {t:'C语言实现哈希表1--哈希表的基本概念与结构设计',d:'2026-10-09 23:00'},
    {t:'2841.几乎唯一子数组的最大和-力扣(LeetCode)--中等',d:'2026-10-07 20:00'}
  ];
  const pad=n=>String(n).padStart(2,'0');
  const fmt=ts=>{const n=new Date(),d=new Date(ts),t=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if(d.toDateString()===n.toDateString())return`今天 ${t}`;
    const y=new Date(n);y.setDate(n.getDate()-1);
    if(d.toDateString()===y.toDateString())return`昨天 ${t}`;
    return`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${t}`};
  document.getElementById('list').innerHTML=data.map(r=>({t:r.t,ts:new Date(r.d.replace(/-/g,'/')).getTime()})).sort((a,b)=>b.ts-a.ts).map(r=>`<li class="task"><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><div><p>${r.t}</p><span>${fmt(r.ts)}</span></div></li>`).join('');
  document.getElementById('ft').textContent=`共 ${data.length} 条记录`;
</script>
</body>
</html>
